# Entorno de laboratorio del servicio clientes.
#   cp infra/.env.example infra/.env   (y completar las claves)
#   docker compose -f infra/docker-compose.yml up --build
# La ruta /api/clientes/** del gateway se coordina con su responsable (fuera de este repo).

name: crm-clientes

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en infra/.env}
      CLIENTES_DB_USUARIO: ${CLIENTES_DB_USUARIO:-clientes}
      CLIENTES_DB_CLAVE: ${CLIENTES_DB_CLAVE:?Definí CLIENTES_DB_CLAVE en infra/.env}
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PUERTO_HOST:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clientes_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNO://:9092,EXTERNO://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNO://kafka:9092,EXTERNO://localhost:${KAFKA_PUERTO_HOST:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNO:PLAINTEXT,EXTERNO:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNO
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "${KAFKA_PUERTO_HOST:-29092}:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  clientes:
    build:
      context: ..
      dockerfile: clientes-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CLIENTES_DB_URL: jdbc:postgresql://postgres:5432/clientes_db
      CLIENTES_DB_USUARIO: ${CLIENTES_DB_USUARIO:-clientes}
      CLIENTES_DB_CLAVE: ${CLIENTES_DB_CLAVE:?Definí CLIENTES_DB_CLAVE en infra/.env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CLIENTES_CUIL_CLAVE: ${CLIENTES_CUIL_CLAVE:?Definí CLIENTES_CUIL_CLAVE en infra/.env}
      CLIENTES_CUIL_HMAC: ${CLIENTES_CUIL_HMAC:?Definí CLIENTES_CUIL_HMAC en infra/.env}
      CLIENTES_CLAVE_LEADS: ${CLIENTES_CLAVE_LEADS:?Definí CLIENTES_CLAVE_LEADS en infra/.env}
      CLIENTES_CLAVE_CALIFICACION: ${CLIENTES_CLAVE_CALIFICACION:?Definí CLIENTES_CLAVE_CALIFICACION en infra/.env}
    expose:
      - "8082"
    # Publicado al host mientras el gateway no esté integrado (design D8).
    ports:
      - "${CLIENTES_PUERTO_HOST:-8082}:8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 6

volumes:
  postgres-data:
