server:
  port: 8082

spring:
  application:
    name: clientes-service
  profiles:
    default: local
  web:
    locale: es
    locale-resolver: fixed
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  # Productor de eventos de integración (design D8 y D11). Los timeouts cortos evitan que un broker caído
  # demore la respuesta HTTP, porque la publicación corre después del commit en el hilo del request.
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # El valor se serializa como JSON con el ObjectMapper de la aplicación y sin headers de tipo
      # (KafkaConfig): fechas en ISO-8601 y consumidores que no necesitan las clases Java de clientes.
      acks: all
      properties:
        "[max.block.ms]": 2000
        "[delivery.timeout.ms]": 10000
        "[request.timeout.ms]": 5000

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

clientes:
  seguridad:
    clave-leads: ${CLIENTES_CLAVE_LEADS}   # mínimo 32 caracteres; ej. openssl rand -base64 32
  telefono:
    region-por-defecto: AR
  cuil:
    clave-cifrado: ${CLIENTES_CUIL_CLAVE}
    clave-hash: ${CLIENTES_CUIL_HMAC}
  consentimiento:
    version-texto: v1         # versión del texto legal que acepta el titular en el preformulario
  situacion-crediticia:
    modo: simulado            # simulado | bcra (Segunda Parte)
    vigencia: 30d
    timeout: 2s
    simulado:
      demora: 0ms
      forzar-no-disponible: false
  interesados:
    tolerancia-precio: 0.10   # acepta unidades hasta 10% por encima del precio máximo (margen de negociación)
  paginacion:
    tamanio-maximo: 50
    tamanio-por-defecto: 20
  kafka:
    topicos:
      cliente-actualizado: cliente-actualizado
      cliente-anonimizado: cliente-anonimizado
    particiones: 3
    replicas: 1             # 1 en local y en el laboratorio (un solo broker)
  errores:
    tipo-base: https://crm.uade.local/errores/

resilience4j:
  circuitbreaker:
    instances:
      situacionCrediticia:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
