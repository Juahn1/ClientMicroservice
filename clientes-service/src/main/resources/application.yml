server:
  port: 8082

spring:
  application:
    name: clientes-service
  profiles:
    default: local
  web:
    locale: es
    locale-resolver: fixed
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

clientes:
  seguridad:
    clave-leads: ${CLIENTES_CLAVE_LEADS}   # mínimo 32 caracteres; ej. openssl rand -base64 32
  telefono:
    region-por-defecto: AR
  cuil:
    clave-cifrado: ${CLIENTES_CUIL_CLAVE}
    clave-hash: ${CLIENTES_CUIL_HMAC}
  situacion-crediticia:
    modo: simulado            # simulado | bcra (Segunda Parte)
    vigencia: 30d
    timeout: 2s
    simulado:
      demora: 0ms
      forzar-no-disponible: false
  interesados:
    tolerancia-precio: 0.10   # acepta unidades hasta 10% por encima del precio máximo (margen de negociación)
  paginacion:
    tamanio-maximo: 50
    tamanio-por-defecto: 20
  kafka:
    topicos:
      cliente-actualizado: cliente-actualizado
      cliente-anonimizado: cliente-anonimizado
  errores:
    tipo-base: https://crm.uade.local/errores/

resilience4j:
  circuitbreaker:
    instances:
      situacionCrediticia:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
