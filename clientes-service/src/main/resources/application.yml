server:
  port: 8082

spring:
  application:
    name: clientes-service
  profiles:
    default: local
  web:
    locale: es
    locale-resolver: fixed
  # Pool mínimo para una sola instancia (la URL/credenciales vienen del perfil activo).
  datasource:
    hikari:
      minimum-idle: 1
      maximum-pool-size: 2
      connection-timeout: 5000
      idle-timeout: 30000
      max-lifetime: 300000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  # Productor de eventos de integración (design D8 y D11). Los timeouts cortos evitan que un broker caído
  # demore la respuesta HTTP, porque la publicación corre después del commit en el hilo del request.
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # El valor se serializa como JSON con el ObjectMapper de la aplicación y sin headers de tipo
      # (KafkaConfig): fechas en ISO-8601 y consumidores que no necesitan las clases Java de clientes.
      acks: all
      properties:
        "[max.block.ms]": 2000
        "[delivery.timeout.ms]": 10000
        "[request.timeout.ms]": 5000
    # Consumidor de lead-calificado para el historial de calificaciones (design D2 y D7 del change 08). El valor llega
    # como bytes y lo traduce LeadCalificadoTraductor: un JSON roto no traba la partición y el tópico de fallidos
    # guarda el mensaje original.
    consumer:
      group-id: clientes-historial
      auto-offset-reset: earliest     # la primera vez carga lo que calificacion ya publicó; releer no duplica
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      properties:
        "[allow.auto.create.topics]": false   # lead-calificado es de calificacion: no lo crea este servicio

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Orígenes permitidos para CORS (coma separados). No usar "*" en producción.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

clientes:
  seguridad:
    clave-leads: ${CLIENTES_CLAVE_LEADS}   # mínimo 32 caracteres; ej. openssl rand -base64 32
    clave-calificacion: ${CLIENTES_CLAVE_CALIFICACION}   # mínimo 32 caracteres y distinta de la de leads
  telefono:
    region-por-defecto: AR
  cuil:
    clave-cifrado: ${CLIENTES_CUIL_CLAVE}
    clave-hash: ${CLIENTES_CUIL_HMAC}
  consentimiento:
    version-texto: v1         # versión del texto legal que acepta el titular en el preformulario
  situacion-crediticia:
    modo: simulado            # simulado | bcra (Segunda Parte)
    vigencia: 30d
    timeout: 2s
    simulado:
      demora: 0ms
      forzar-no-disponible: false
  interesados:
    tolerancia-precio: 0.10   # acepta unidades hasta 10% por encima del precio máximo (margen de negociación)
  paginacion:
    tamanio-maximo: 50
    tamanio-por-defecto: 20
  kafka:
    topicos:
      cliente-actualizado: cliente-actualizado
      cliente-anonimizado: cliente-anonimizado
      lead-calificado: lead-calificado                    # de calificacion: el servicio lo consume, no lo crea
      lead-calificado-dlt: lead-calificado.clientes.DLT    # mensajes de lead-calificado que no se pudieron registrar
    particiones: 3
    replicas: 1             # 1 en local y en el laboratorio (un solo broker)
  # Historial de calificaciones (design D3 y D5 del change 08).
  historial:
    # Para la fecha de LeadCalificado cuando llega sin zona.
    zona-fecha: ${CLIENTES_HISTORIAL_ZONA_FECHA:America/Argentina/Buenos_Aires}
    reintentos:               # falla transitoria: 2s, 4s, 8s, 16s, 32s (unos 62 s) y después al DLT
      intentos: 5
      espera-inicial: 2s
      multiplicador: 2
  errores:
    tipo-base: https://crm.uade.local/errores/

# Circuit breaker de la fuente de situación crediticia (design D5 del change 05). El timeout no va acá: lo impone
# cada fuente con clientes.situacion-crediticia.timeout.
resilience4j:
  circuitbreaker:
    instances:
      situacionCrediticia:
        sliding-window-size: 10
        minimum-number-of-calls: 10            # por defecto son 100, más que la ventana: el circuito no se abriría
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 1
